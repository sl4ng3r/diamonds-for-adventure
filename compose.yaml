services:
  bedrock-test:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BEDROCK_VERSION: ${BEDROCK_VERSION:-1.26.61.1}
    platform: linux/amd64
    environment:
      EULA: ${EULA:-FALSE}
    ports:
      - "${BEDROCK_PORT:-19132}:19132/udp"
    volumes:
      - ./data:/data
      - ./prototype/behavior_pack:/server/behavior_packs/cavediamonds:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'test "$$(cat /proc/1/comm)" = bedrock_server']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stdin_open: true
    tty: true

networks:
  default:
    ipam:
      config:
        - subnet: ${BEDROCK_NETWORK_SUBNET:-10.254.251.0/24}
